# Kconfig for debug builds, added on top of prj.conf for every board by
# presets that set APP_BUILD_MODE=debug (see CMakeLists.txt)

# No optimization (-O0). With -Og, one source line often compiles to several
# copies, and each copy needs one of the Cortex-M0+'s only 4 hardware
# breakpoints. At -O0 every line maps to one address.
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# Unoptimized code needs more stack: catch overflows with an MPU stack guard
CONFIG_HW_STACK_PROTECTION=y

# Stacks that overflow at -O0 (default sizes are for optimized code)
CONFIG_UDC_STM32_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=3072

# Enable debugging shell commands
CONFIG_SHELL_PROMPT_UART="DBG > "
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_SHELL_VT100_COMMANDS=y
