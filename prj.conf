# C++23 with the full GNU C++ standard library (no exceptions/RTTI)
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_GPIO=y
CONFIG_SERIAL=y

# sys_reboot(), used to reboot into the USB DFU bootloader
CONFIG_REBOOT=y

# Logging and CLI
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="> "

# Disabling some default shell commands
CONFIG_DATE_SHELL=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_CMDS_RETURN_VALUE=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n

# USB device stack with CDC ACM as console/shell backend
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Custom"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CRSF to FSDB01"
CONFIG_UART_LINE_CTRL=y

# The USB stack logs a warning when Zephyr's test VID/PID is used
CONFIG_USBD_LOG_LEVEL_ERR=y
# CDC ACM can't log to itself when it is the console backend
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
